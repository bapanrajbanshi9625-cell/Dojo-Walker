name: Dojo Walker CI/CD Pipeline

on:
  push:
    branches:
      - "main"

  pull_request:
    branches:
      - "main"

jobs:
  build_and_test:
    name: Build and Test Flutter App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.0"
          channel: "stable"
          cache: true

      - name: Check Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Generate app icon
        run: flutter pub run flutter_launcher_icons

      - name: Analyze code
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Clean Flutter
        run: flutter clean

      - name: Install dependencies again
        run: flutter pub get

      # -----------------------------------------------
      # DEBUG APK
      # -----------------------------------------------
      - name: Build Debug APK
        run: flutter build apk --debug || true

      - name: Find Debug APK
        run: |
          echo "======================================"
          echo "DEBUG APK"
          echo "======================================"

          find build -type f -name "*.apk" -exec ls -lh {} \;

      - name: Prepare Debug APK
        run: |
          mkdir -p build/debug-apk

          APK=$(find build -type f -name "app-debug.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: Debug APK was not generated."
            exit 1
          fi

          echo "Found Debug APK: $APK"

          cp "$APK" build/debug-apk/dojo-walker-debug.apk

          ls -lh build/debug-apk/

      # -----------------------------------------------
      # RELEASE APK
      # -----------------------------------------------
      - name: Build ARM64 Release APK
        run: flutter build apk --release --target-platform android-arm64 || true

      - name: Find Release APK
        run: |
          echo "======================================"
          echo "RELEASE APK"
          echo "======================================"

          find build -type f -name "*.apk" -exec ls -lh {} \;

      - name: Prepare Release APK
        run: |
          mkdir -p build/release-apk

          APK=$(find build -type f -name "app-release.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: Release APK was not generated."
            exit 1
          fi

          echo "Found Release APK: $APK"

          cp "$APK" build/release-apk/dojo-walker-arm64-release.apk

          ls -lh build/release-apk/

      # -----------------------------------------------
      # UPLOAD DEBUG APK
      # -----------------------------------------------
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: dojo-walker-debug-apk
          path: build/debug-apk/dojo-walker-debug.apk

      # -----------------------------------------------
      # UPLOAD RELEASE APK
      # -----------------------------------------------
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: dojo-walker-release-apk
          path: build/release-apk/dojo-walker-arm64-release.apk
