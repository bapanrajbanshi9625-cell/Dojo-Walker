name: Dojo Walker CI/CD Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dojo-walker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build_and_test:
    name: Build and Test Flutter App
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:

      # ==========================================================
      # CHECKOUT
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================================
      # JAVA 17
      # ==========================================================

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ==========================================================
      # FLUTTER 3.44.8
      # ==========================================================

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: true


      # ==========================================================
      # TOOLCHAIN CHECK
      # ==========================================================

      - name: Check Flutter version
        run: flutter --version

      - name: Check Dart version
        run: dart --version

      - name: Check Java version
        run: java -version

      - name: Check Gradle version
        shell: bash
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --version


      # ==========================================================
      # CLEAN ALL BUILD STATE
      # ==========================================================

      - name: Clean Flutter and Gradle state
        shell: bash
        run: |
          flutter clean

          rm -rf android/.gradle
          rm -rf build
          rm -rf .dart_tool


      # ==========================================================
      # DEPENDENCIES
      # ==========================================================

      - name: Install dependencies
        run: flutter pub get


      # ==========================================================
      # APP ICON
      # ==========================================================

      - name: Generate app icons
        run: dart run flutter_launcher_icons


      # ==========================================================
      # ANALYZE
      # ==========================================================

      - name: Analyze code
        run: flutter analyze --no-fatal-infos
        continue-on-error: true


      # ==========================================================
      # TEST
      # ==========================================================

      - name: Run tests
        run: flutter test


      # ==========================================================
      # BUILD RELEASE APK
      # ==========================================================

      - name: Build Release APK
        env:
          GRADLE_OPTS: >-
            -Dorg.gradle.daemon=false
            -Dorg.gradle.caching=false
            -Dorg.gradle.parallel=false
            -Dorg.gradle.jvmargs=-Xmx4g
        run: flutter build apk --release


      # ==========================================================
      # FIND APK
      # ==========================================================

      - name: Find Release APK
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "Generated APK files"
          echo "======================================"

          find build \
            -type f \
            -name "*.apk" \
            -exec ls -lh {} \;


      # ==========================================================
      # PREPARE APK
      # ==========================================================

      - name: Prepare Release APK
        shell: bash
        run: |
          set -e

          mkdir -p build/release-apk

          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: Release APK was not generated."
            echo ""
            echo "Available APK files:"
            find build \
              -type f \
              -name "*.apk" \
              -print || true
            exit 1
          fi

          cp "$APK" \
            build/release-apk/Dojo-Walker-release.apk

          echo "======================================"
          echo "Final Dojo Walker APK"
          echo "======================================"

          ls -lh \
            build/release-apk/Dojo-Walker-release.apk


      # ==========================================================
      # UPLOAD APK
      # ==========================================================

      - name: Upload Dojo Walker Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Dojo-Walker-release-apk
          path: build/release-apk/Dojo-Walker-release.apk
          if-no-files-found: error
          retention-days: 7
