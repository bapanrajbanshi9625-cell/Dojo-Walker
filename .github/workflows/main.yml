name: Dojo Walker CI/CD Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build_and_test:
    name: Build and Test Flutter App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "17"

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: true

      - name: Check Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Generate app icon
        run: flutter pub run flutter_launcher_icons

      - name: Analyze code
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

      - name: Clean Flutter
        run: flutter clean

      - name: Install dependencies again
        run: flutter pub get

      - name: Build Release APK
        env:
          GRADLE_OPTS: >-
            -Dorg.gradle.daemon=false
            -Dorg.gradle.caching=true
            -Dorg.gradle.parallel=false
            -Dorg.gradle.jvmargs=-Xmx4g
        run: flutter build apk --release

      - name: Find Release APK
        run: |
          find build -type f -name "*.apk" -exec ls -lh {} \;

      - name: Prepare Release APK
        run: |
          mkdir -p build/release-apk
          APK=$(find build -type f -name "app-release.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: Release APK was not generated."
            exit 1
          fi

          cp "$APK" build/release-apk/Dojo-Walker-release.apk
          ls -lh build/release-apk/

      - name: Upload Dojo Walker Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Dojo-Walker-release-apk
          path: build/release-apk/Dojo-Walker-release.apk
          if-no-files-found: error
