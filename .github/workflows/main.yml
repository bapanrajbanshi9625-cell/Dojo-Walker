name: Dojo Walker CI/CD Pipeline

on:
  push:
    branches:
      - "main"

  pull_request:
    branches:
      - "main"

jobs:
  build_and_test:
    name: Build and Test Flutter App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.0"
          channel: "stable"
          cache: true

      - name: Check Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Generate app icon
        run: flutter pub run flutter_launcher_icons

      - name: Analyze code
        run: flutter analyze

      - name: Run tests
        run: flutter test

      # Build ARM64 APK
      - name: Build ARM64 APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Rename ARM64 APK
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/dojo-walker-arm64-v8a-release.apk

      # Build ARMv7 APK
      - name: Build ARMv7 APK
        run: flutter build apk --release --target-platform android-arm

      - name: Rename ARMv7 APK
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/dojo-walker-armeabi-v7a-release.apk

      - name: List generated APKs
        run: |
          echo "======================================"
          echo "Dojo Walker APKs"
          echo "======================================"
          ls -lh build/app/outputs/flutter-apk/

      - name: Upload Android APKs
        uses: actions/upload-artifact@v4
        with:
          name: dojo-walker-apks
          path: |
            build/app/outputs/flutter-apk/dojo-walker-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/dojo-walker-armeabi-v7a-release.apk
