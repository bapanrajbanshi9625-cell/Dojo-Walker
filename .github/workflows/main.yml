name: Dojo Walker CI/CD Pipeline

on:
  push:
    branches:
      - "main"

  pull_request:
    branches:
      - "main"

jobs:
  build_and_test:
    name: Build and Test Flutter App
    runs-on: ubuntu-latest

    steps:
      # -----------------------------------------------
      # CHECKOUT
      # -----------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------------------------
      # JAVA
      # -----------------------------------------------
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "17"

      # -----------------------------------------------
      # FLUTTER
      # -----------------------------------------------
      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.0"
          channel: "stable"
          cache: true

      - name: Check Flutter version
        run: flutter --version

      # -----------------------------------------------
      # DEPENDENCIES
      # -----------------------------------------------
      - name: Install dependencies
        run: flutter pub get

      # -----------------------------------------------
      # APP ICON
      # -----------------------------------------------
      - name: Generate app icon
        run: flutter pub run flutter_launcher_icons

      # -----------------------------------------------
      # ANALYZE
      # -----------------------------------------------
      - name: Analyze code
        run: flutter analyze

      # -----------------------------------------------
      # TEST
      # -----------------------------------------------
      - name: Run tests
        run: flutter test

      # -----------------------------------------------
      # CLEAN
      # -----------------------------------------------
      - name: Clean Flutter
        run: flutter clean

      # -----------------------------------------------
      # INSTALL DEPENDENCIES AGAIN
      # -----------------------------------------------
      - name: Install dependencies again
        run: flutter pub get

      # -----------------------------------------------
      # BUILD RELEASE APK
      # -----------------------------------------------
      - name: Build Release APK
        run: flutter build apk --release

      # -----------------------------------------------
      # FIND APK
      # -----------------------------------------------
      - name: Find Release APK
        run: |
          echo "======================================"
          echo "Generated Release APK"
          echo "======================================"

          find build -type f -name "*.apk" -exec ls -lh {} \;

      # -----------------------------------------------
      # PREPARE RELEASE APK
      # -----------------------------------------------
      - name: Prepare Release APK
        run: |
          mkdir -p build/release-apk

          APK=$(find build -type f -name "app-release.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: Release APK was not generated."
            exit 1
          fi

          echo "Found APK: $APK"

          cp "$APK" build/release-apk/Dojo-Walker-release.apk

          echo "======================================"
          echo "Final Dojo Walker APK"
          echo "======================================"

          ls -lh build/release-apk/

      # -----------------------------------------------
      # UPLOAD RELEASE APK
      # -----------------------------------------------
      - name: Upload Dojo Walker Release APK
        uses: actions/upload-artifact@v4
        with:
          name: dojo-walker-release-apk
          path: build/release-apk/Dojo-Walker-release.apk
