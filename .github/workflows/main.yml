name: Dojo Walker CI/CD Pipeline

on:
  push:
    branches:
      - "main"

  pull_request:
    branches:
      - "main"

jobs:
  build_and_test:
    name: Build and Test Flutter App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.0"
          channel: "stable"
          cache: true

      - name: Check Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Generate app icon
        run: flutter pub run flutter_launcher_icons

      - name: Analyze code
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Clean Flutter
        run: flutter clean

      - name: Install dependencies again
        run: flutter pub get

      - name: Build ARM64 APK
        run: flutter build apk --release --target-platform android-arm64 || true

      - name: Find ARM64 APK
        run: |
          echo "Searching for APK..."
          find build -type f -name "*.apk" -exec ls -lh {} \;

      - name: Prepare APK
        run: |
          mkdir -p build/apk

          APK=$(find build -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: No APK was generated."
            exit 1
          fi

          echo "Found APK: $APK"

          cp "$APK" build/apk/dojo-walker-arm64-v8a-release.apk

          echo "Final APK:"
          ls -lh build/apk/

      - name: Upload Dojo Walker APK
        uses: actions/upload-artifact@v4
        with:
          name: dojo-walker-apk
          path: build/apk/dojo-walker-arm64-v8a-release.apk
