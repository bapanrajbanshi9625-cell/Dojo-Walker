name: dojo_walker
description: "Dojo Walker - Dog walking service application"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^4.12.1
  firebase_auth: ^6.5.6
  cloud_firestore: ^6.7.1
  firebase_storage: ^13.4.5

  # Local Storage
  shared_preferences: ^2.5.3

  # QR Scanner
  mobile_scanner: ^5.2.3

  # Selfie Camera
  image_picker: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  image_path: "assets/DOJO_WALKER.png"
  android: true
  ios: false
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  assets:
    - assets/DOJO_WALKER.png
    - assets/dojo_walker_splash.png
