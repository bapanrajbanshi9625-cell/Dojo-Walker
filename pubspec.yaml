name: dojo_walker
description: "Dojo Walker - Dog walking service application"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ==========================================================
  # UI
  # ==========================================================

  cupertino_icons: ^1.0.6

  # ==========================================================
  # FIREBASE
  # ==========================================================

  firebase_core: ^3.15.2
  firebase_auth: ^5.7.0
  cloud_firestore: ^5.6.12
  firebase_storage: ^12.4.10

  # ==========================================================
  # LOCAL STORAGE
  # ==========================================================

  shared_preferences: ^2.2.3

  # ==========================================================
  # NETWORK / CONNECTIVITY
  # ==========================================================

  connectivity_plus: ^6.1.4

  # ==========================================================
  # HTTP / CLOUDINARY
  # ==========================================================

  http: ^1.2.2

  # ==========================================================
  # REAL DEVICE LOCATION / GPS
  # ==========================================================

  geolocator: ^12.0.0

  # ==========================================================
  # REAL MAP
  # OpenStreetMap tiles + Flutter Map
  # ==========================================================

  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # ==========================================================
  # QR SCANNER
  # ==========================================================

  mobile_scanner: ^5.1.0

  # ==========================================================
  # IMAGE
  # Camera / Gallery / Selfie / Aadhaar / PAN
  # ==========================================================

  image_picker: ^1.1.2

  # ==========================================================
  # CALL / EXTERNAL MAP / URL
  # ==========================================================

  url_launcher: ^6.3.0

  # ==========================================================
  # WALK REQUEST RINGTONE / AUDIO
  # ==========================================================

  audioplayers: ^6.4.0


dev_dependencies:
  flutter_test:
    sdk: flutter

  # ==========================================================
  # LINT
  # ==========================================================

  flutter_lints: ^3.0.0

  # ==========================================================
  # APP ICON GENERATOR
  # ==========================================================

  flutter_launcher_icons: ^0.13.1


# ============================================================
# APP ICON
# ============================================================

flutter_launcher_icons:
  android: true
  ios: false

  image_path: "assets/DOJO_WALKER.png"

  remove_alpha_ios: true


# ============================================================
# FLUTTER
# ============================================================

flutter:
  uses-material-design: true

  assets:
    # --------------------------------------------------------
    # APP IMAGES
    # --------------------------------------------------------

    - assets/DOJO_WALKER.png
    - assets/dojo_walker_splash.png

    # --------------------------------------------------------
    # WALK REQUEST SOUND
    # --------------------------------------------------------

    - assets/audio/Dojo_Walker_Walk_Request.mp3
