name: dojo_walker
description: "Dojo Walker - Dog walking service application"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6

  # ==========================================================
  # FIREBASE
  # ==========================================================

  firebase_core: ^2.24.2
  firebase_auth: ^4.17.6
  cloud_firestore: ^4.17.5
  firebase_storage: ^11.6.5

  # ==========================================================
  # LOCAL STORAGE
  # ==========================================================

  shared_preferences: ^2.2.3

  # ==========================================================
  # NETWORK / INTERNET
  # ==========================================================

  connectivity_plus: ^6.1.4

  # ==========================================================
  # QR SCANNER
  # ==========================================================

  mobile_scanner: ^5.1.0

  # ==========================================================
  # IMAGE PICKER
  # Gallery + Camera + Selfie + Aadhaar
  # ==========================================================

  image_picker: ^1.1.2


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

  flutter_launcher_icons: ^0.13.1


# ============================================================
# APP ICON
# ============================================================

flutter_launcher_icons:
  image_path: "assets/DOJO_WALKER.png"
  android: true
  ios: false
  remove_alpha_ios: true


# ============================================================
# FLUTTER
# ============================================================

flutter:
  uses-material-design: true

  assets:
    - assets/DOJO_WALKER.png
    - assets/dojo_walker_splash.png
