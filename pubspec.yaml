name: dojo_walker
description: "Dojo Walker - Dog walking service application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6

  # Firebase
  firebase_core: ^2.24.2
  firebase_auth: ^4.16.0
  cloud_firestore: ^4.17.5

  # Local Storage
  shared_preferences: ^2.2.3

  # QR Scanner
  mobile_scanner: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  image_path: "assets/dojo_logo.png"
  android: true
  ios: false

flutter:
  uses-material-design: true

  assets:
    - assets/dojo_logo.png
    - assets/dojo_walker_splash.png
