name: dojo_walker
description: "Dojo Walker - Dog walking service application"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6

  # ==========================================================
  # FIREBASE
  # ==========================================================

  firebase_core: ^3.15.2
  firebase_auth: ^5.7.0
  cloud_firestore: ^5.6.12
  firebase_storage: ^12.4.10

  # ==========================================================
  # LOCAL STORAGE
  # ==========================================================

  shared_preferences: ^2.2.3

  # ==========================================================
  # NETWORK
  # ==========================================================

  connectivity_plus: ^6.1.4

  # ==========================================================
  # LOCATION
  # ==========================================================

  geolocator: ^12.0.0

  # ==========================================================
  # MAP
  # ==========================================================

  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # ==========================================================
  # QR SCANNER
  # ==========================================================

  mobile_scanner: ^5.1.0

  # ==========================================================
  # IMAGE
  # Gallery + Camera + Selfie + Aadhaar
  # ==========================================================

  image_picker: ^1.1.2

  # ==========================================================
  # CALL / SMS / MAP
  # ==========================================================

  url_launcher: ^6.3.0

  # ==========================================================
  # WALK REQUEST RINGTONE
  # ==========================================================

  audioplayers: ^6.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

  flutter_launcher_icons: ^0.13.1

# ============================================================
# APP ICON
# ============================================================

flutter_launcher_icons:
  image_path: "assets/DOJO_WALKER.png"
  android: true
  ios: false
  remove_alpha_ios: true

# ============================================================
# FLUTTER
# ============================================================

flutter:
  uses-material-design: true

  assets:
    - assets/DOJO_WALKER.png
    - assets/dojo_walker_splash.png
    - assets/audio/Dojo_Walker_Walk_Request.mp3
